[project]
name = "databricks-smart-mobility-lakehouse"
version = "0.1.0"
description = "Production-grade Medallion Data Lakehouse pipeline built with PySpark and Delta Lake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true
disallow_untyped_decorators = false
disallow_untyped_calls = false
disallow_subclassing_any = false
warn_unused_ignores = false
